<!doctype html>
<html lang="de">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/logo/fitness-world-logo.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <script>
      // Staging-Schutz: Auf *.vercel.app darf nichts in den Google-Index.
      // Zweite Ebene zum X-Robots-Tag-Header aus vercel.json — greift auch,
      // falls die Seite einmal ohne Vercel-Routing ausgeliefert wird.
      if (/\.vercel\.app$/i.test(location.hostname)) {
        var robots = document.createElement('meta')
        robots.name = 'robots'
        robots.content = 'noindex,nofollow'
        document.head.appendChild(robots)
      }
    </script>
    <title>Fitness World Studios | 24/7 Training, Reha-Sport, Kurse &amp; Fighter World</title>
    <!-- Startwerte für Tab und Crawler. Die Startseite überschreibt Titel und
         Beschreibung aus Sanity (Startseite > SEO); hier stehen sie, damit sie
         schon vor dem ersten Render stimmen. -->
    <meta name="description" content="24/7 Zugang, persönliche Betreuung, Reha-Sport, Kurse und Fighter World an allen Standorten. Finde deinen Einstieg beim kostenlosen Probetraining." />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Anton&family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
